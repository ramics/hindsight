name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Network tests are deselected by default (see pyproject's addopts). They hit
      # NCBI, download roughly 1.2 GB, and are rate-limited per IP, so they do not
      # belong in CI. Run them locally with: pytest -m network
      - name: Test
        run: uv run pytest -q
