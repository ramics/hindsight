[project]
name = "hindsight"
version = "0.1.0"
description = "Build a time-correct viral reference database from archived NCBI RefSeq release catalogs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hindsight contributors" }]
keywords = ["bioinformatics", "refseq", "metagenomics", "benchmark", "leakage"]

dependencies = [
    "click==8.1.7",
    "requests==2.32.3",
    "urllib3==2.2.3",
    "tqdm==4.66.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[project.scripts]
hindsight = "hindsight.cli:main"

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires outbound access to NCBI (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
